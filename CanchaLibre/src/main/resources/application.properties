spring.application.name=canchalibre

# Puerto por donde escucha nuestro servidor web
server.port=80

# Formato de salida del log (horas y minutos)
logging.pattern.dateformat=hh:mm

# Evitar la salida del banner de Spring
spring.main.banner-mode=off

# Definir el caché en falso para ver cambios en plantillas Thymeleaf inmediatamente
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# ==============================================================================
# Configuración de Firebase Storage
# ==============================================================================
firebase.bucket.name=${FIREBASE_BUCKET_NAME:techshop-4f012.firebasestorage.app}
firebase.storage.path=${FIREBASE_STORAGE_PATH:cancha-libre}
firebase.json.path=${FIREBASE_JSON_PATH:firebase}
firebase.json.file=${FIREBASE_JSON_FILE:techshop-4f012-firebase-adminsdk-fbsvc-84ad9b5cd0.json}
