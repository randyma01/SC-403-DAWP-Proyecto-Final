<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' | CanchaLibre'">CanchaLibre</title>
    <link rel="icon" th:href="@{/img/placeholders/futbol-1.svg}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/font-awesome/6.5.2/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/canchalibre.css}">
</head>
<body>

<!-- ===================== NAVBAR PUBLICO ===================== -->
<header th:fragment="navbar" class="cl-navbar">
    <nav class="navbar navbar-expand-lg container py-2">
        <a class="navbar-brand cl-logo" th:href="@{/}">CANCHA<br>LIBRE</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navPrincipal"
                th:attr="aria-label=#{nav.menu}"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navPrincipal">
            <ul class="navbar-nav mx-auto gap-lg-3">
                <li class="nav-item"><a class="nav-link" th:classappend="${uri == '/'} ? 'active'" th:href="@{/}" th:text="#{nav.inicio}">Inicio</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/#como-funciona}" th:text="#{nav.comofunciona}">Como funciona</a></li>
                <li class="nav-item" th:if="${usuarioActual != null}"><a class="nav-link" th:classappend="${uri != null and #strings.startsWith(uri, '/mis-reservas')} ? 'active'" th:href="@{/mis-reservas}" th:text="#{nav.misreservas}">Mis reservas</a></li>
                <li class="nav-item" th:if="${usuarioActual != null and usuarioActual.admin}"><a class="nav-link" th:href="@{/admin}" th:text="#{nav.admin}">Administracion</a></li>
            </ul>
            <div class="d-flex align-items-center gap-2 flex-wrap">
                <span class="cl-ubicacion d-none d-xl-inline"><i class="fa-solid fa-location-dot"></i> <span th:text="#{nav.ubicacion}">Costa Rica</span></span>
                <span class="cl-lang btn-group">
                    <a class="btn btn-outline-cl" th:classappend="${#locale.language == 'es'} ? 'active'" th:href="@{${uri ?: '/'}(lang=es)}">ES</a>
                    <a class="btn btn-outline-cl" th:classappend="${#locale.language == 'en'} ? 'active'" th:href="@{${uri ?: '/'}(lang=en)}">EN</a>
                </span>
                <th:block th:if="${usuarioActual == null}">
                    <a class="btn btn-outline-cl" th:href="@{/login}" th:text="#{nav.login}">Ingresar</a>
                    <a class="btn btn-cl" th:href="@{/registro}" th:text="#{nav.registro}">Registrarse</a>
                </th:block>
                <th:block th:if="${usuarioActual != null}">
                    <a class="cl-bell" th:href="@{/cuenta/notificaciones}" th:title="#{nav.notificaciones}">
                        <i class="fa-regular fa-bell"></i>
                        <span class="badge rounded-pill" th:if="${notifNoLeidas != null and notifNoLeidas > 0}" th:text="${notifNoLeidas}">1</span>
                    </a>
                    <span class="cl-avatar" th:text="${usuarioActual.iniciales}" th:title="${usuarioActual.nombreCompleto}">AB</span>
                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button class="btn btn-outline-cl btn-sm" type="submit" th:text="#{nav.logout}">Salir</button>
                    </form>
                </th:block>
            </div>
        </div>
    </nav>
</header>

<!-- ===================== MENSAJES FLASH ===================== -->
<div th:fragment="mensajes" class="container mt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${exito != null}">
        <i class="fa-solid fa-circle-check me-1"></i> <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{comun.cerrar}"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error != null}">
        <i class="fa-solid fa-triangle-exclamation me-1"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" th:attr="aria-label=#{comun.cerrar}"></button>
    </div>
</div>

<!-- ===================== FOOTER ===================== -->
<footer th:fragment="footer" class="cl-footer">
    <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
        <span class="cl-logo">CANCHA LIBRE</span>
        <span th:text="#{footer.texto}">Reserva de canchas deportivas en Costa Rica</span>
        <span>&copy; 2026 CanchaLibre &middot; SC-403</span>
    </div>
</footer>

<!-- ===================== SCRIPTS ===================== -->
<th:block th:fragment="scripts">
    <script th:inline="javascript">
        window.CL_MSG = {
            cancelar: /*[[#{cancelar.confirmar}]]*/ 'Cancelar?',
            expirada: /*[[#{pago.error.expirada}]]*/ 'Expirada',
            sinSeleccion: /*[[#{disp.sel.ninguna}]]*/ '-',
            copiado: /*[[#{pago.copiado}]]*/ 'Copiado',
            agregar: /*[[#{insumos.agregar}]]*/ 'Agregar'
        };
        window.CL_LANG = /*[[${#locale.language}]]*/ 'es';
    </script>
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/canchalibre.js}"></script>
</th:block>
</body>
</html>
