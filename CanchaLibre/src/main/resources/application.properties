spring.application.name=canchalibre

# Puerto por donde escucha nuestro servidor web
server.port=80

# Formato de salida del log (horas y minutos)
logging.pattern.dateformat=hh:mm

# Evitar la salida del banner de Spring
spring.main.banner-mode=off

# Definir el caché en falso para ver cambios en plantillas Thymeleaf inmediatamente
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false
