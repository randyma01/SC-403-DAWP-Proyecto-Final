<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{admin.insumos.titulo})}"></head>
<body class="cl-admin">
<div class="cl-admin-shell">
    <aside th:replace="~{admin/fragmentos :: sidebar('insumos')}"></aside>
    <div class="cl-admin-main">
        <div th:replace="~{admin/fragmentos :: topbar(#{admin.insumos.titulo})}"></div>
        <div class="cl-admin-content">
            <div th:replace="~{admin/fragmentos :: alertas}"></div>
            <form th:action="@{/admin/insumos}" th:object="${form}" method="post" class="cl-panel" novalidate>
                <input type="hidden" th:field="*{id}">
                <h2 class="h5" th:text="${form.id == null} ? #{admin.insumos.nuevo} : #{admin.insumos.editar}">Insumo</h2>
                <div class="row g-3">
                    <div class="col-md-6"><label class="form-label" for="nombre" th:text="#{campo.nombre}">Nombre</label>
                        <input class="form-control" th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'" id="nombre" th:field="*{nombre}"><div class="invalid-feedback" th:errors="*{nombre}"></div></div>
                    <div class="col-md-6"><label class="form-label" for="categoria" th:text="#{campo.categoria}">Categoria</label>
                        <select class="form-select" id="categoria" th:field="*{categoria}"><option th:each="c : ${categorias}" th:value="${c}" th:text="#{${'categoria.' + c.name()}}">Equipamiento</option></select></div>
                    <div class="col-12"><label class="form-label" for="descripcion" th:text="#{campo.descripcion}">Descripcion</label><textarea class="form-control" id="descripcion" rows="2" th:field="*{descripcion}"></textarea></div>
                    <div class="col-md-4"><label class="form-label" for="precio" th:text="#{campo.precio}">Precio</label>
                        <input class="form-control" type="number" step="0.01" min="0.01" th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'" id="precio" th:field="*{precio}"><div class="invalid-feedback" th:errors="*{precio}"></div></div>
                    <div class="col-md-4"><label class="form-label" for="unidad" th:text="#{campo.unidad}">Unidad</label><input class="form-control" id="unidad" th:field="*{unidad}"></div>
                    <div class="col-md-4"><label class="form-label" for="stock" th:text="#{campo.stock}">Stock</label>
                        <input class="form-control" type="number" min="0" th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'" id="stock" th:field="*{stock}"><div class="form-text" th:text="#{campo.stock.ayuda}">Vacio = ilimitado</div><div class="invalid-feedback" th:errors="*{stock}"></div></div>
                    <div class="col-12"><label class="form-label" th:text="#{campo.aplicaa}">Aplica a</label>
                        <div class="row g-1"><div class="col-6 col-md-3" th:each="d : ${disciplinas}"><div class="form-check">
                            <input class="form-check-input" type="checkbox" name="disciplinaIds" th:id="'di' + ${d.id}" th:value="${d.id}" th:checked="${form.disciplinaIds.contains(d.id)}">
                            <label class="form-check-label" th:for="'di' + ${d.id}" th:text="${d.nombre}">Futbol</label></div></div></div>
                        <div class="form-text" th:text="#{campo.aplicaa.ayuda}">Sin seleccion = aplica a todas.</div></div>
                    <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="activo" th:field="*{activo}"><label class="form-check-label" for="activo" th:text="#{estado.activo}">Activo</label></div></div>
                </div>
                <div class="mt-4 d-flex gap-2"><button class="btn btn-cl px-4" type="submit" th:text="#{comun.guardar}">Guardar</button>
                    <a class="btn btn-outline-cl" th:href="@{/admin/insumos}" th:text="#{comun.cancelar}">Cancelar</a></div>
            </form>
        </div>
    </div>
</div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
