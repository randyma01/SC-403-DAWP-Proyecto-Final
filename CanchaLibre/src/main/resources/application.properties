spring.application.name=canchalibre

# Carga secretos locales (Aiven / Firebase) si existen; en produccion se usan variables de entorno
spring.config.import=optional:file:./secrets.properties,optional:file:./CanchaLibre/secrets.properties

# Puerto por donde escucha nuestro servidor web
server.port=80

# Formato de salida del log (horas y minutos)
logging.pattern.dateformat=hh:mm

# Evitar la salida del banner de Spring
spring.main.banner-mode=off

# Definir el cach\u00c3\u00a9 en falso para ver cambios en plantillas Thymeleaf inmediatamente
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=false

# ==============================================================================
# Configuraci\u00c3\u00b3n de Firebase Storage
# ==============================================================================
firebase.bucket.name=${FIREBASE_BUCKET_NAME:techshop-4f012.firebasestorage.app}
firebase.storage.path=${FIREBASE_STORAGE_PATH:cancha-libre}
firebase.json.path=${FIREBASE_JSON_PATH:firebase}
firebase.json.file=${FIREBASE_JSON_FILE:techshop-4f012-firebase-adminsdk-fbsvc-84ad9b5cd0.json}

# ==============================================================================
# Base de datos: MySQL en Aiven (SSL obligatorio) o MySQL local
# Ejemplo Aiven: jdbc:mysql://<host>.aivencloud.com:<puerto>/defaultdb?sslMode=REQUIRED
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/canchalibre?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Aiven limita las conexiones simultaneas: pool pequeno y reciclaje antes del corte por inactividad
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.keepalive-time=300000

# El esquema lo administra database/01_schema.sql, Hibernate NO lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Costa_Rica

# ==============================================================================
# Internacionalizacion (i18n) y subida de archivos
# ==============================================================================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
# Sin esto, un servidor con locale en ingles mostraria messages_en aun cuando el usuario pide espanol
spring.messages.fallback-to-system-locale=false
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================================
# Reglas de negocio de CanchaLibre
# ==============================================================================
# Minutos que se retiene un bloque horario mientras el usuario completa el pago (HU-10)
app.reserva.minutos-limite=15
# Frecuencia (ms) con la que se liberan reservas vencidas y se finalizan las pasadas
app.reserva.intervalo-expiracion-ms=30000
# Cantidad de complejos por pagina en el catalogo (HU-01)
app.catalogo.tamano-pagina=12

# ==============================================================================
# Almacenamiento de imagenes y comprobantes
#   firebase -> Firebase Storage (produccion / equipo)
#   local    -> carpeta ./uploads (desarrollo sin credenciales)
# ==============================================================================
app.storage.provider=${STORAGE_PROVIDER:firebase}
app.storage.local-dir=${STORAGE_LOCAL_DIR:uploads}

